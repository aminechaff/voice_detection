[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-master"
version = "0.1.0"
description = "Enregistre le micro et le son Windows, puis transcrit en dialogue avec Faster-Whisper."
requires-python = ">=3.11,<3.13"
dependencies = [
  "customtkinter>=5.2,<7",
  "PyAudioWPatch>=0.2.12.7,<0.3",
  "faster-whisper>=1.2.1,<2",
]

[project.urls]
Homepage = "https://github.com/aminechaff/voice_detection"
Repository = "https://github.com/aminechaff/voice_detection"
Issues = "https://github.com/aminechaff/voice_detection/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
voice-master = "voicemaster.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
